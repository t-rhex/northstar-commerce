server.port=${PORT:4005}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/northstar}
spring.datasource.username=${POSTGRES_USER:northstar}
spring.datasource.password=${POSTGRES_PASSWORD:northstar-dev}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=2000
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=8s
