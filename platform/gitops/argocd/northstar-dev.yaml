apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: northstar-dev
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: northstar
  source:
    repoURL: https://github.com/REPLACE_ORG/REPLACE_CONFIG_REPO.git
    targetRevision: main
    path: environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: northstar
  syncPolicy:
    automated: { enabled: true, prune: true, selfHeal: true, allowEmpty: false }
    syncOptions: [CreateNamespace=true, PruneLast=true, ServerSideApply=true]
    retry:
      limit: 5
      backoff: { duration: 5s, factor: 2, maxDuration: 3m }
