apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: { name: northstar-secrets-manager, namespace: northstar }
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: northstar-runtime, namespace: northstar }
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic
  secretStoreRef: { name: northstar-secrets-manager, kind: SecretStore }
  target: { name: northstar-runtime, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: northstar/dev/runtime, property: DATABASE_URL }
    - secretKey: REDIS_URL
      remoteRef: { key: northstar/dev/runtime, property: REDIS_URL }
    - secretKey: AMQP_URL
      remoteRef: { key: northstar/dev/runtime, property: AMQP_URL }
