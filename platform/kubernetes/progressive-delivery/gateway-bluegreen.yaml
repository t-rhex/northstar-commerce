apiVersion: v1
kind: Service
metadata: { name: gateway-active, namespace: northstar }
spec: { selector: { app.kubernetes.io/name: gateway }, ports: [{ name: http, port: 4000, targetPort: http }] }
---
apiVersion: v1
kind: Service
metadata: { name: gateway-preview, namespace: northstar }
spec: { selector: { app.kubernetes.io/name: gateway }, ports: [{ name: http, port: 4000, targetPort: http }] }
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: { name: gateway, namespace: northstar }
spec:
  replicas: 4
  revisionHistoryLimit: 5
  rollbackWindow: { revisions: 3 }
  selector: { matchLabels: { app.kubernetes.io/name: gateway } }
  strategy:
    blueGreen:
      activeService: gateway-active
      previewService: gateway-preview
      previewReplicaCount: 2
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 60
      scaleDownDelayRevisionLimit: 2
      prePromotionAnalysis: { templates: [{ templateName: gateway-smoke }] }
  template:
    metadata: { labels: { app.kubernetes.io/name: gateway, app.kubernetes.io/part-of: northstar-commerce } }
    spec:
      containers:
        - name: gateway
          image: REPLACE_ECR/gateway@sha256:REPLACE_DIGEST
          ports: [{ name: http, containerPort: 4000 }]
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 384Mi } }
