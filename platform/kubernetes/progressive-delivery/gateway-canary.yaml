apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: { name: gateway-canary, namespace: northstar }
spec:
  replicas: 10
  rollbackWindow: { revisions: 3 }
  selector: { matchLabels: { app.kubernetes.io/name: gateway-canary } }
  strategy:
    canary:
      stableService: gateway-stable
      canaryService: gateway-canary
      maxSurge: 2
      maxUnavailable: 0
      steps:
        - { setWeight: 5 }
        - { pause: { duration: 2m } }
        - { analysis: { templates: [{ templateName: gateway-slo }] } }
        - { setWeight: 25 }
        - { pause: { duration: 5m } }
        - { analysis: { templates: [{ templateName: gateway-slo }] } }
        - { setWeight: 50 }
        - { pause: {} }
  template:
    metadata: { labels: { app.kubernetes.io/name: gateway-canary, app.kubernetes.io/part-of: northstar-commerce } }
    spec:
      containers:
        - name: gateway
          image: REPLACE_ECR/gateway@sha256:REPLACE_DIGEST
          ports: [{ name: http, containerPort: 4000 }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 384Mi } }
