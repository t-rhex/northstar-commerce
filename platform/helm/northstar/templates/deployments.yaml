{{- range $name, $config := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "northstar.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ $config.replicas }}
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ $.Release.Name }} }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/part-of: northstar-commerce
      annotations:
        checksum/config: {{ toJson $config.env | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: {{ $name }} }
      containers:
        - name: {{ $name }}
          image: {{ include "northstar.image" (list $ $name $config) }}
          imagePullPolicy: {{ $.Values.global.pullPolicy }}
          ports: [{ name: http, containerPort: {{ $config.port }}, protocol: TCP }]
          env:
            - { name: PORT, value: {{ $config.port | quote }} }
            - { name: OTEL_SERVICE_NAME, value: {{ $name | quote }} }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ $.Values.global.otlpEndpoint | quote }} }
            - { name: ENVIRONMENT, value: {{ $.Values.global.environment | quote }} }
            {{- range $key, $value := $config.env }}
            - { name: {{ $key }}, value: {{ $value | quote }} }
            {{- end }}
          envFrom:
            - secretRef: { name: {{ $.Values.global.runtimeSecret }}, optional: true }
          startupProbe:
            httpGet: { path: {{ default "/health/live" $config.healthPath }}, port: http }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: {{ default "/health/ready" $config.healthPath }}, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: {{ default "/health/live" $config.healthPath }}, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop: { exec: { command: ["/bin/sh", "-c", "sleep 5"] } }
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
{{- end }}
