input {
  gelf {
    port => 12201
    use_udp => true
    use_tcp => false
  }
}

filter {
  mutate {
    add_field => {
      "[event][original]" => "%{message}"
      "[event][dataset]" => "northstar.application"
      "[service][environment]" => "development"
    }
  }

  json {
    source => "message"
    target => "[northstar]"
    skip_on_invalid_json => true
    tag_on_failure => ["_northstar_json_parse_failure"]
  }

  if [northstar] {
    mutate {
      copy => {
        "[northstar][service]" => "[service][name]"
        "[northstar][level]" => "[log][level]"
        "[northstar][event]" => "[event][action]"
        "[northstar][requestId]" => "[labels][request_id]"
        "[northstar][traceId]" => "[trace][id]"
        "[northstar][transactionId]" => "[labels][checkout_transaction_id]"
        "[northstar][step]" => "[labels][checkout_step]"
        "[northstar][stepStatus]" => "[labels][checkout_step_status]"
        "[northstar][method]" => "[http][request][method]"
        "[northstar][path]" => "[url][path]"
        "[northstar][status]" => "[http][response][status_code]"
        "[northstar][durationMs]" => "[event][duration_ms]"
        "[northstar][orderId]" => "[labels][order_id]"
        "[northstar][message]" => "[message]"
      }
    }
  }

  if ![service][name] and [tag] {
    mutate { add_field => { "[service][name]" => "%{tag}" } }
  }

  mutate {
    remove_field => ["northstar", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "northstar-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}
